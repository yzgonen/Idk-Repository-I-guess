name: SpeedSMPAuction
version: 1.0.0
main: dev.wtuxy.auction.AuctionPlugin
api-version: '1.21'
depend: [Citizens]
commands:
  tiers:
    description: View the tier list or add a player
    usage: /tiers [add <name> <tier>|colors]
  tier:
    description: Set or remove a player's tier
    usage: /tier <name> <set <S|A|B|C|D>|remove>
  pos:
    description: Configure auction lineup positions
    usage: /pos <add|delete> <1-8>
  posteam:
    description: Set a team teleport position
    usage: /posteam <color>
  assign:
    description: Assign or clear an S-tier captain color
    usage: /assign <color> <S-tier-player> or /assign remove <S-tier-player>
  assignp:
    description: Assign or clear a normal player's team
    usage: /assignp <color> <player> or /assignp remove <player>
  credits:
    description: Check or manage a team's auction credits
    usage: /credits [player|add <player> <amount>|remove <player> <amount>]
  axs:
    description: Set regular or S-tier join spawn
    usage: /axs set <all|S>
  auction:
    description: Control the auction and remove auction stand-ins
    usage: /auction <start|stop|npcs clear>
  bidding:
    description: Control or restart auction bidding
    usage: /bidding <start|pause|stop|restart <A|B|C|D>>
  sell:
    description: Sell the current player to the highest bidder
    usage: /sell
  pvp:
    description: Toggle server-wide auction protection mode
    usage: /pvp <on|off>
permissions:
  auction.admin:
    description: Manage auction setup and controls
    default: op
