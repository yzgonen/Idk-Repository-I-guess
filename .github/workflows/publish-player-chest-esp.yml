name: Publish Player Chest ESP X-Ray JAR

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-player-chest-esp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ESP build branch
        uses: actions/checkout@v4
        with:
          ref: player-chest-esp-build
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build Fabric JAR (1.21.11 retry)
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle -p player-chest-esp clean build --stacktrace 2>&1 | tee player-chest-esp/build-log.txt

      - name: Commit build log on failure
        if: steps.build.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- player-chest-esp/build-log.txt
          git commit -m 'ESP 1.21.11 build failure log' || true
          git push origin HEAD:player-chest-esp-build
          exit 1

      - name: Put release JAR in repo
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p player-chest-esp/dist
          JAR=$(find player-chest-esp/build/libs -maxdepth 1 -type f -name 'player-chest-esp-*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" player-chest-esp/dist/player-chest-esp-xray-1.21.11.jar
          rm -f player-chest-esp/build-log.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- player-chest-esp/dist/player-chest-esp-xray-1.21.11.jar
          git add -u -- player-chest-esp/build-log.txt || true
          if git diff --cached --quiet; then
            echo 'JAR unchanged; nothing to commit.'
          else
            git commit -m 'Build Player Chest ESP X-Ray 1.21.11 JAR'
            git push origin HEAD:player-chest-esp-build
          fi

      - name: Upload JAR artifact too
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: Player-Chest-ESP-XRay-1.21.11
          path: player-chest-esp/dist/player-chest-esp-xray-1.21.11.jar
          if-no-files-found: error
