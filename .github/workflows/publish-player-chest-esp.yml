name: Publish Player Chest ESP X-Ray JAR

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/publish-player-chest-esp.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ESP build branch
        uses: actions/checkout@v4
        with:
          ref: player-chest-esp-build
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Fabric JAR
        run: gradle -p player-chest-esp clean build --stacktrace

      - name: Put release JAR in repo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p player-chest-esp/dist
          JAR=$(find player-chest-esp/build/libs -maxdepth 1 -type f -name 'player-chest-esp-*.jar' ! -name '*-sources.jar' | head -n 1)
          test -n "$JAR"
          cp "$JAR" player-chest-esp/dist/player-chest-esp-xray-1.21.1.jar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- player-chest-esp/dist/player-chest-esp-xray-1.21.1.jar
          if git diff --cached --quiet; then
            echo 'JAR unchanged; nothing to commit.'
          else
            git commit -m 'Build Player Chest ESP X-Ray JAR'
            git push origin HEAD:player-chest-esp-build
          fi

      - name: Upload JAR artifact too
        uses: actions/upload-artifact@v4
        with:
          name: Player-Chest-ESP-XRay-1.21.1
          path: player-chest-esp/dist/player-chest-esp-xray-1.21.1.jar
          if-no-files-found: error
