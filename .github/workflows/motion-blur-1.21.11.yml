name: Build Tuxy Motion Blur 1.21.11

on:
  push:
    branches:
      - motion-blur-1.21.11
    paths:
      - 'motion-blur-1.21.11/**'
      - '.github/workflows/motion-blur-1.21.11.yml'
  pull_request:
    paths:
      - 'motion-blur-1.21.11/**'
      - '.github/workflows/motion-blur-1.21.11.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build mod
        working-directory: motion-blur-1.21.11
        run: gradle clean build --no-daemon --stacktrace

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: Tuxy-Motion-Blur-1.21.11
          path: motion-blur-1.21.11/build/libs/Tuxy-Motion-Blur-1.21.11-*.jar
          if-no-files-found: error
