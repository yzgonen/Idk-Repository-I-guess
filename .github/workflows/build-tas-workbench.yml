name: Build standalone TAS Plugin DLL
on:
  workflow_dispatch:
  push:
    branches: [ tas-workbench-clean-build ]
    paths:
      - "TASPlugin/**"
      - ".github/workflows/build-tas-workbench.yml"
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Get BakkesMod SDK
        shell: pwsh
        run: git clone --depth 1 https://github.com/bakkesmodorg/BakkesModSDK.git bakkesmodsdk
      - name: Prepare ImGui
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "bakkesmodsdk\imgui_bm.zip" -DestinationPath "imgui-unpacked" -Force
          $header = Get-ChildItem "imgui-unpacked" -Recurse -Filter "imgui.h" | Select-Object -First 1
          if (-not $header) { throw "BakkesMod SDK ImGui header not found" }
          $imguiDir = $header.Directory.FullName
          New-Item -ItemType Directory -Force "bakkesmodsdk\include\imgui" | Out-Null
          Copy-Item "$imguiDir\*" "bakkesmodsdk\include\imgui" -Recurse -Force
          New-Item -ItemType Directory -Force "imgui-src" | Out-Null
          Copy-Item "$imguiDir\*" "imgui-src" -Recurse -Force
          foreach ($source in @("imgui.cpp","imgui_draw.cpp","imgui_widgets.cpp")) {
            if (-not (Test-Path "imgui-src\$source")) { throw "Missing ImGui source: $source" }
          }
      - name: Build x64 Release
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set "SDK=%CD%\bakkesmodsdk"
          cl /nologo /LD /EHsc /std:c++17 /W4 /DWIN32_LEAN_AND_MEAN /DNOMINMAX /I "%SDK%\include" /I "%CD%\imgui-src" TASPlugin\TASPlugin.cpp imgui-src\imgui.cpp imgui-src\imgui_draw.cpp imgui-src\imgui_widgets.cpp "%SDK%\lib\pluginsdk.lib" /link /OUT:TASPlugin.dll
          if errorlevel 1 exit /b %errorlevel%
      - name: Package DLL
        shell: pwsh
        run: |
          if (-not (Test-Path "TASPlugin.dll")) { throw "TASPlugin.dll was not produced" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "TASPlugin.dll" "out/TASPlugin.dll"
          @"
          1. Copy TASPlugin.dll to %APPDATA%\bakkesmod\bakkesmod\plugins\
          2. Open Rocket League F6 and run: plugin load TASPlugin
          3. Use the TAS Plugin page in F2.
          Runs in offline Free Play or Custom Training.
          "@ | Set-Content "out/INSTALL.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: TASPlugin-DLL
          path: out/*
