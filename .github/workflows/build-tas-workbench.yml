name: Build TAS Workbench DLL
on:
  workflow_dispatch:
  push:
    branches: [ tas-workbench-clean-build ]
    paths:
      - "TASWorkbench/**"
      - ".github/workflows/build-tas-workbench.yml"
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Get BakkesMod SDK
        shell: pwsh
        run: git clone --depth 1 https://github.com/bakkesmodorg/BakkesModSDK.git bakkesmodsdk
      - name: Prepare ImGui
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath "bakkesmodsdk\imgui_bm.zip" -DestinationPath "imgui-unpacked" -Force
          $header = Get-ChildItem "imgui-unpacked" -Recurse -Filter "imgui.h" | Select-Object -First 1
          if (-not $header) { throw "BakkesMod SDK ImGui header not found" }
          $imguiDir = $header.Directory.FullName
          New-Item -ItemType Directory -Force "bakkesmodsdk\include\imgui" | Out-Null
          Copy-Item "$imguiDir\*" "bakkesmodsdk\include\imgui" -Recurse -Force
          $sources = Get-ChildItem "imgui-unpacked" -Recurse -Include "imgui.cpp","imgui_draw.cpp","imgui_tables.cpp","imgui_widgets.cpp" -File
          if (-not $sources) { throw "BakkesMod ImGui archive contains headers but no ImGui implementation sources; cannot link ImGui calls." }
          "IMGUI_DIR=$imguiDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $sources.FullName | ForEach-Object { "IMGUI_SOURCE=$_ " -replace " $","" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 }
      - name: Build x64 Release
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set "SDK=%CD%\bakkesmodsdk"
          cl /nologo /LD /EHsc /std:c++17 /W4 /DWIN32_LEAN_AND_MEAN /DNOMINMAX /I "%SDK%\include" /I "%IMGUI_DIR%" TASWorkbench\src\TASWorkbench.cpp %IMGUI_SOURCE_1% %IMGUI_SOURCE_2% %IMGUI_SOURCE_3% %IMGUI_SOURCE_4% "%SDK%\lib\pluginsdk.lib" /link /OUT:TASWorkbench.dll
          if errorlevel 1 exit /b %errorlevel%
      - name: Package DLL
        shell: pwsh
        run: |
          if (-not (Test-Path "TASWorkbench.dll")) { throw "TASWorkbench.dll was not produced" }
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item "TASWorkbench.dll" "out/TASWorkbench.dll"
          @"
          Install:
          1. Copy TASWorkbench.dll to %APPDATA%\bakkesmod\bakkesmod\plugins\
          2. In Rocket League, open F6 and run: plugin load TASWorkbench
          3. Load the original TAS plugin too; the shot buttons call its commands.
          Open the F2 plugin settings and choose TAS Workbench.
          "@ | Set-Content "out/INSTALL.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: TASWorkbench-DLL
          path: out/*
