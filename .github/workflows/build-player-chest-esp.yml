name: Build Player Chest ESP X-Ray

on:
  push:
    branches:
      - player-chest-esp-build
    paths:
      - 'player-chest-esp/**'
      - '.github/workflows/build-player-chest-esp.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Fabric mod
        run: gradle -p player-chest-esp clean build --stacktrace

      - name: Show built files
        run: ls -lah player-chest-esp/build/libs/

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: Player-Chest-ESP-XRay-1.21.1
          path: |
            player-chest-esp/build/libs/player-chest-esp-*.jar
            !player-chest-esp/build/libs/*-sources.jar
          if-no-files-found: error
