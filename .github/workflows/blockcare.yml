name: Zenn Windows Release
on:
  push:
    branches: [main]
    paths: ['BlockCare/**', '.github/workflows/blockcare.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish BlockCare/BlockCare.csproj -c Release -o output
      - uses: actions/upload-artifact@v4
        with:
          name: Zenn-Windows-x64
          path: output/Zenn.exe
      - name: Publish direct EXE download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zenn-latest
          name: Zenn latest build
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: output/Zenn.exe
