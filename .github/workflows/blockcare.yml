name: Zenn Windows Release
on:
  push:
    branches: [main]
    paths: ['BlockCare/**', '.github/workflows/blockcare.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet publish BlockCare/BlockCare.csproj -c Release -o output
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build setup wizard
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" BlockCare/ZennSetup.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Zenn-Setup-Windows-x64
          path: output/ZennSetup.exe
          if-no-files-found: error
      - name: Publish direct EXE download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zenn-latest
          name: Zenn v0.4.0
          body: "Zenn setup installer for Windows x64."
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: output/ZennSetup.exe
