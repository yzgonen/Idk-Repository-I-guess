name: Build RL TAS Windows\n\non:\n  workflow_dispatch:\n  push:\n    branches: [ rltas-build ]\n\njobs:\n  build:\n    runs-on: windows-2022\n    steps:\n      - uses: actions/checkout@v4\n      - name: Fetch exact CodeRed and RLSDK\n        shell: pwsh\n        run: |\n          git clone https://github.com/CodeRedModding/CodeRed-Template.git work\n          cd work; git checkout 64198bda43808265ba5ed98eed9fc794b2e7a86f; cd ..\n          git clone https://github.com/smallest-cock/RLSDK.git sdk\n          cd sdk; git checkout 7ec01aa23e8ce3b91436847c973dc7acb15a8613; cd ..\n          Copy-Item -Recurse -Force sdk/RLSDK work/RLSDK\n          Copy-Item -Force src/RLTAS_CORE.hpp work/RLTAS_CORE.hpp\n          Copy-Item -Force src/RLTAS_HOTKEYS.cpp work/RLTAS_HOTKEYS.cpp\n      - name: Patch project\n        run: python patch_build.py\n      - name: Build x64 Release\n        shell: cmd\n        run: |\n          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"\n          msbuild work\CodeRedTemplate.sln /m /p:Configuration=Release /p:Platform=x64\n      - name: Collect output\n        shell: pwsh\n        run: |\n          New-Item -ItemType Directory -Force out | Out-Null\n          Get-ChildItem work -Recurse -Filter CodeRedTemplate.dll | Copy-Item -Destination out\n      - name: Upload Windows build\n        uses: actions/upload-artifact@v4\n        with:\n          name: RLTAS-Windows-Build\n          path: out/*