name: Build RL TAS Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, rltas-build ]
  pull_request:
    branches: [ main ]

jobs:
  bakkesmod-build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Get BakkesMod SDK
        shell: pwsh
        run: git clone --depth 1 https://github.com/bakkesmodorg/BakkesModSDK.git bakkesmodsdk
      - name: Build RLTAS BakkesMod x64 Release
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          set BAKKESMODSDK=%CD%\bakkesmodsdk
          msbuild bakkesmod\RLTASPlugin.vcxproj /m /p:Configuration=Release /p:Platform=x64
      - name: Collect DLL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $dll = Get-ChildItem . -Recurse -Filter RLTASPlugin.dll | Where-Object { $_.FullName -notlike "*bakkesmodsdk*" } | Select-Object -First 1
          if (-not $dll) { throw "RLTASPlugin.dll build output not found" }
          Copy-Item $dll.FullName out/RLTASPlugin.dll
      - name: Upload BakkesMod plugin
        uses: actions/upload-artifact@v4
        with:
          name: RLTAS-BakkesMod
          path: out/RLTASPlugin.dll
