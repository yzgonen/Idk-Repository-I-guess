name: Zenn Windows Build
on:
  push:
    branches: [zenn-swills-style]
    paths: ['BlockCare/**', '.github/workflows/zenn-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish Zenn for Windows x64
        run: dotnet publish BlockCare/BlockCare.csproj -c Release -o output
      - uses: actions/upload-artifact@v4
        with:
          name: Zenn-Windows-x64
          path: output/Zenn.exe
          if-no-files-found: error
