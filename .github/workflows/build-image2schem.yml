name: Build Image2Schem

on:
  push:
    branches: [ main ]
    paths:
      - 'image-schematic/**'
      - '.github/workflows/build-image2schem.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image-schematic
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Build
        run: gradle build --stacktrace
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image2Schem-1.21.11
          path: image-schematic/build/libs/image2schem-*.jar
          if-no-files-found: error
