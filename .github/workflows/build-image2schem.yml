name: Build Image2Schem

on:
  push:
    branches: [ main ]
    paths:
      - 'image-schematic/**'
      - '.github/workflows/build-image2schem.yml'
  workflow_dispatch:

concurrency:
  group: image2schem-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: image-schematic
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Cache Depth Anything model
        uses: actions/cache@v4
        with:
          path: ~/.image2schem/models
          key: image2schem-depth-anything-v2-small-v1
      - name: Build and run generic regression tests
        run: gradle build --stacktrace
      - name: Real Depth Anything ONNX smoke test
        env:
          IMAGE2SCHEM_RUN_MODEL_TEST: '1'
        run: gradle test --tests com.vanguard.image2schem.NeuralDepthAIIntegrationTest --rerun-tasks --stacktrace
      - name: Upload QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Image2Schem-QA
          path: |
            image-schematic/build/reports/
            image-schematic/build/test-results/
          if-no-files-found: ignore
      - name: Upload mod JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image2Schem-1.21.11
          path: image-schematic/build/libs/image2schem-*.jar
          if-no-files-found: error
